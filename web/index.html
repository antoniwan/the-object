<script>
// The pearl grows with what has really arrived: the page, its letters, its body, then its shape
// (seed.grow, from the script at the end). Between arrivals it leans slowly toward the next one,
// never past it. Once the object is awake it fills, and then it is let go (#veil.full above).
(() => {
  const seed = document.getElementById('seed');
  let got = 0.04, next = 0.15, lean = 0.04, shown = 0, last = performance.now();
  seed.grow = (g, n = g) => {
    got = Math.max(got, g);
    next = Math.max(next, n, got);
  };
  document.fonts?.ready.then(() => seed.grow(0.15, 0.22));
  const frame = (now) => {
    const dt = Math.min(0.1, Math.max(0, now - last) / 1000);
    last = now;
    const b = document.body.classList;
    if (b.contains('failed')) return;
    const awake = b.contains('awake');
    if (awake) got = next = 1;
    lean = Math.max(got, lean + (next - lean) * (1 - Math.exp(-dt / 1.4)));
    shown += (lean - shown) * (1 - Math.exp(-dt * (awake ? 9 : 5)));
    seed.style.setProperty('--g', shown.toFixed(3));
    if (awake && shown > 0.985) seed.parentElement.classList.add('full');
    else requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
