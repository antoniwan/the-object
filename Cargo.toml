[package]
name = "chaos-object"
version = "1.24.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Only the browser half (src/platform/, wasm only) uses these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CssStyleDeclaration",
  "DomTokenList",
  "Performance",
  "Event",
  "CustomEvent",
  "CustomEventInit",
  "EventTarget",
  "MouseEvent",
  "PointerEvent",
  "WheelEvent",
  "AddEventListenerOptions",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "KeyboardEvent",
  "Storage",
  "StorageEvent",
  "AudioContext",
  "BaseAudioContext",
  "AudioNode",
  "AudioParam",
  "AudioDestinationNode",
  "AudioScheduledSourceNode",
  "GainNode",
  "OscillatorNode",
  "OscillatorType",
  "AudioContextState",
  "AnalyserNode",
  "MediaStreamAudioSourceNode",
  "Navigator",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "HtmlMediaElement",
  "HtmlVideoElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "console",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
lossy_float_literal = "warn"
