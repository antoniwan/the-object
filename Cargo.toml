[package]
name = "chaos-object"
version = "1.13.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CssStyleDeclaration",
  "DomTokenList",
  "Performance",
  "Event",
  "CustomEvent",
  "CustomEventInit",
  "EventTarget",
  "MouseEvent",
  "PointerEvent",
  "WheelEvent",
  "AddEventListenerOptions",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "KeyboardEvent",
  "Storage",
  "AudioContext",
  "BaseAudioContext",
  "AudioNode",
  "AudioParam",
  "AudioDestinationNode",
  "AudioScheduledSourceNode",
  "GainNode",
  "OscillatorNode",
  "OscillatorType",
  "AudioContextState",
  "AnalyserNode",
  "MediaStreamAudioSourceNode",
  "Navigator",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "HtmlMediaElement",
  "HtmlVideoElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "console",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
