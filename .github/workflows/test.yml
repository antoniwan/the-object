# Runs the simulation tests and a full build on every push and pull request.
# Hosting is on Vercel, which builds and deploys main on its own.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100
      - run: cargo test
      - run: ./build.sh
