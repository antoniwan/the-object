# On every push to main and every pull request: the tests, the lints, the simulation fingerprints,
# the Node tests, a full build and the itch pack, then the built page loaded in headless Chromium.
# Hosting is on Vercel, which builds and deploys main on its own.
name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the run before it pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT: 1.63.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100
      - uses: Swatinem/rust-cache@v2
      - name: The version moved on
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          base=$(git show FETCH_HEAD:Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          head=$(./scripts/version.sh)
          if [ "$head" = "$base" ] || [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)" != "$head" ]; then
            echo "::error::Cargo.toml says $head and $GITHUB_BASE_REF says $base. Run ./scripts/version.sh <next> and write its CHANGELOG.md entry (CONTRIBUTING.md, Versions)."
            exit 1
          fi
      - run: cargo test
      # Compiler warnings and the lints that catch mistakes fail the build. Style, complexity and
      # speed lints only warn: the toolchain is the newest stable, and each release adds some.
      - name: No warnings or suspect code, native and wasm
        run: |
          lints="-D warnings -A clippy::style -A clippy::complexity -A clippy::perf"
          cargo clippy --all-targets -- $lints
          cargo clippy --release --target wasm32-unknown-unknown -- $lints
      - name: The simulation ends where it did
        run: cargo run --release --example frame_bench -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
      - run: ./build.sh
      - run: ./scripts/itch.sh
      # Only the browser download is kept between runs; the system packages it needs are installed each time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT }}-${{ runner.os }}
      - name: The page wakes in each browser, first visit and return
        run: |
          npm i -g playwright@$PLAYWRIGHT
          playwright install --with-deps chromium
          NODE_PATH=$(npm root -g) node scripts/load-check.mjs
